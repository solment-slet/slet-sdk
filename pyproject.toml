[project]
name = "slet-sdk"
version = "0.1.1"
authors = [
    { name = "Walter Kerrigan", email = "esolment@gmail.com" },
]
requires-python = ">=3.12,<4"
license = { file = "LICENSE" }
dependencies = [
    "aioconsole>=0.8.2",
    "httpx>=0.28,<1",
    "loguru>=0.7.3",
    "pydantic[email]>=2.12,<3",
    "websockets>=15,<17",
    "requests>=2.33,<2.34",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "hypothesis>=6.152.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"