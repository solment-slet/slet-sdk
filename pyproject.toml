[project]
name = "slet-sdk"
version = "0.1.1"
authors = [
    { name = "Walter Kerrigan", email = "esolment@gmail.com" },
]
requires-python = ">=3.10,<4"
license = { file = "LICENSE" }
dependencies = [
    "aioconsole>=0.8.2",
    "httpx>=0.28,<1",
    "loguru>=0.7.3",
    "pydantic[email]>=2.12,<3",
    "websockets>=15,<17",
    "requests>=2.33,<2.34",
    "system-info>=2.0.3",
    "uvicorn>=0.49.0",
    "fastapi>=0.137.2",
]

[project.optional-dependencies]
tests = [
    "sentence-transformers>=6.0.0",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "python-dotenv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/slet_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
